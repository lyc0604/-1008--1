<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網路爭議（假）訊息及深偽影音案件處理 SOP</title>
<style>
:root {
  --c: #059669;
  --soft: #ecfdf5;
  --bd: #6ee7b7;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: #f3f4f6;
  color: #1f2937;
  line-height: 1.6;
}
.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  font-size: 20px;
  margin: 0;
}
.sub {
  font-size: 13px;
  color: #6b7280;
}
nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0;
}
button {
  font-family: inherit;
  cursor: pointer;
}
.tab {
  padding: 8px 16px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  transition: all 0.2s ease;
}
.tab.on {
  color: #fff;
  border-color: transparent;
}
.printbtn {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid #374151;
  background: #374151;
  color: #fff;
  font-size: 14px;
}
.printbtn:hover {
  background: #1f2937;
}
.panel { display: none; }
.panel.on { display: block; }
.banner {
  border: 2px solid var(--bd);
  background: var(--soft);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 12px;
}
.banner b { font-size: 18px; }
.modes {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.mode {
  padding: 6px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #fff;
  font-size: 13px;
}
.mode.on {
  background: var(--c);
  color: #fff;
  border-color: var(--c);
}
.pill {
  display: table;
  margin: 0 auto;
  padding: 2px 16px;
  border-radius: 99px;
  background: var(--c);
  color: #fff;
  font-size: 13px;
}
.arrow {
  text-align: center;
  color: var(--c);
  font-size: 22px;
  line-height: 1.1;
  margin: 2px 0;
}
.step-h {
  width: 100%;
  text-align: left;
  border: 2px solid var(--bd);
  background: var(--soft);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.num {
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--c);
  color: #fff;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.step-h .t { font-weight: 600; }
.step-h .s { font-size: 13px; opacity: .8; }
.detail {
  display: none;
  margin: 8px 0 0 18px;
  padding-left: 14px;
  border-left: 4px solid #e5e7eb;
}
.step.open .detail, .full .detail { display: block; }
.branches {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.br {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  break-inside: avoid;
}
.br b { display: block; margin-bottom: 2px; }
.br div { white-space: pre-line; color: #4b5563; }
ul { margin: 6px 0; padding-left: 20px; font-size: 14px; }
.note {
  background: #fffbeb;
  border: 1px solid #fcd34d;
  color: #78350f;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  margin: 6px 0;
}
h2 { font-size: 17px; margin: 22px 0 8px; }
table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  font-size: 13px;
}
th, td {
  border: 1px solid #d1d5db;
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}
th { background: #f3f4f6; }
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  break-inside: avoid;
}
.card .d { color: #4b5563; }
.card .w { color: #dc2626; }
.chk {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  padding: 3px 0;
  font-size: 13px;
  color: #374151;
  cursor: pointer;
}
.chk::before { content: "☐ "; font-size: 15px; }
.chk.on { text-decoration: line-through; color: #9ca3af; }
.chk.on::before { content: "☑ "; color: var(--c); }
.prog {
  height: 8px;
  background: #e5e7eb;
  border-radius: 9px;
  margin: 6px 0 10px;
  overflow: hidden;
}
